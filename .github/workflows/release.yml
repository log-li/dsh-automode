name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # manual: publish the current package.json version

permissions:
  contents: write # create GitHub Release
  id-token: write # npm provenance (OIDC trusted publishing)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 必须是 Node 24：**npm 可信发布（OIDC）要求 npm ≥ 11.5.1**，Node 22 自带
          # npm 10.x → 根本不会尝试 OIDC，直接 ENEEDAUTH（2026-09-12 实测）。
          node-version: '24'
        # ⚠ **不要**设 `registry-url`：设了 setup-node 会写出含
        # `_authToken=${NODE_AUTH_TOKEN}` 的 .npmrc 并导出占位 token，
        # npm 优先用该 token 而非 OIDC → `E404 Not Found - PUT …`
        # （provenance 却已签署成功，极具误导性）。见 npm/cli#8730。

      # Why no build/test here: dsh-automode peer-depends on host-private
      # @deepseek-ai packages (e.g. dsh-sandbox-policy 0.1.x exists only
      # inside a DSH host; the public registry only has 0.0.x), so a standalone
      # CI cannot resolve/install them. Quality gate stays LOCAL: Spec-first
      # implementation + typecheck/build + the smoke suite (`npm test`, 94 at
      # v0.15.1) + opt-in real-model E2E (`npm run test:e2e`) + independent-model
      # review, all before the release is triggered. The compiled lib/ ships in
      # git, so publishing needs no CI build.
      - name: Verify release artifacts
        run: |
          test -f lib/index.js || { echo "lib/index.js missing — run npm run build before tagging"; exit 1; }
          echo "publishing version: $(node -p 'require("./package.json").version')"
          test -f CHANGELOG.md || { echo "CHANGELOG.md missing"; exit 1; }

      - name: Publish to npm (trusted publishing / OIDC; provenance signs the tarball)
        # ⚠ 这里**不能**设 `NODE_AUTH_TOKEN`（哪怕是 `${{ secrets.NPM_TOKEN }}`）：
        # 该 secret 不存在时它是**空字符串**，npm 见到变量存在就改用 token 认证、
        # **直接绕过 OIDC** → `ENEEDAUTH`。可信发布只靠 `id-token: write`。
        #
        # `--ignore-scripts` 跳过 `prepublishOnly`（= `npm run build` → `tsc`）：
        # 本仓 CI 刻意不装依赖（宿主私有 @deepseek-ai 包在公共 registry 上无法解析），
        # 缺 `@types/node` 会让 tsc 报 TS2688（2026-09-12 实测失败原因）。
        # 编译产物 lib/ 随 git 提交，由上方 “Verify release artifacts” 断言存在，
        # 因此发布这一步**不需要**构建。
        run: npm publish --provenance --ignore-scripts

      - name: Create GitHub Release with changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 版本从 package.json 取，而不是 $GITHUB_REF_NAME：后者在
          # workflow_dispatch（在 main 上手动触发）时会等于分支名 "main"，
          # 会让 GitHub Release 被命名成 "main"。package.json 才是发布的真相，
          # 且与 `npm publish` 实际发出去的版本一致。
          VER="v$(node -p 'require("./package.json").version')"
          python3 - "$VER" <<'PY' > /tmp/release-notes.md
          import re, sys
          ver = sys.argv[1].lstrip('v')
          s = open('CHANGELOG.md').read()
          en, _, zh = s.partition('\n# 更新日志')  # English block, then 中文区块
          pat = rf'## \[{re.escape(ver)}\].*?(?=\n## \[|\Z)'
          grab = lambda b: re.search(pat, b, re.S).group(0).strip() if re.search(pat, b, re.S) else ''
          out = grab(en)
          zhh = grab(zh) if zh else ''
          notes = out + (('\n\n---\n\n' + zhh) if zhh else '')
          print(notes or f'Release {sys.argv[1]} (see CHANGELOG.md)')
          PY
          if gh release view "$VER" >/dev/null 2>&1; then
            gh release edit "$VER" --title "Release $VER" --notes-file /tmp/release-notes.md
            echo "release existed — notes updated"
          else
            gh release create "$VER" --title "Release $VER" --notes-file /tmp/release-notes.md
          fi
